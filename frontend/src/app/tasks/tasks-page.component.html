<h1 class="tasks-page-title">Tasks</h1>

@if (loadError) {
  <mat-card class="tasks-alert" appearance="outlined">
    <mat-card-content>
      <p class="form-error" role="alert">{{ loadError }}</p>
    </mat-card-content>
  </mat-card>
}

<mat-sidenav-container
  class="tasks-shell"
  [hasBackdrop]="isNarrow()"
  (backdropClick)="onDetailClosed()"
>
  <mat-sidenav
    class="tasks-detail-drawer"
    position="end"
    [mode]="isNarrow() ? 'over' : 'side'"
    [opened]="selectedTask !== null"
    [fixedInViewport]="true"
    [fixedTopGap]="toolbarTopGapPx"
  >
    @if (selectedTask; as task) {
      <app-task-detail-pane
        [task]="task"
        [allTasks]="tasks"
        (taskUpdated)="refreshTasks()"
        (taskDeleted)="onTaskDeletedFromPane()"
        (closed)="onDetailClosed()"
        (dependenciesChanged)="refreshDependencies()"
      />
    }
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="tasks-page-content">
      <app-task-form
        (created)="onQuickCreated($event)"
        (openDetail)="onOpenNewTaskDetail($event)"
        (focused)="onDetailClosed()"
      />

      <app-task-list
        [tasks]="tasks"
        [selectedTaskId]="selectedTaskId"
        [blockedTaskIds]="blockedTaskIds"
        [blockingTaskIds]="blockingTaskIds"
        (selectedTaskIdChange)="onSelectedTaskIdChange($event)"
        (taskUpdated)="refreshTasks()"
      />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
