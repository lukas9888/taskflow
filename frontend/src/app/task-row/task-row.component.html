<mat-list-item [activated]="selected" [class.task-row-completed]="completed" (click)="onRowActivate($event)">
  <span matListItemIcon class="task-row-leading">
    <mat-checkbox
      [checked]="completed"
      (change)="completedChange.emit($event.checked)"
      (click)="$event.stopPropagation()"
      aria-label="Mark task complete"
    />
  </span>

  <span matListItemTitle [class.task-title-done]="completed">{{ task.title }}</span>

  <span matListItemMeta class="task-row-meta">
    @let pm = priorityMarker();
    <mat-icon
      class="task-row-prio-icon"
      inline
      [style.color]="pm.color"
      aria-hidden="true"
    >{{ pm.icon }}</mat-icon>
    <span class="task-row-chip">{{ categoryLabel }}</span>
    @if (task.dueAt; as due) {
      <span class="task-row-due" [attr.aria-label]="'Due ' + (due | date: 'fullDate')">{{
        due | date: 'MMM d, y'
      }}</span>
    }
    <mat-icon class="task-row-chevron" aria-hidden="true">chevron_right</mat-icon>
  </span>

  @if (showDivider) {
    <mat-divider />
  }
</mat-list-item>
